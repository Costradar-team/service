<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cost Radar 대시보드</title>
 
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
 
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1f2933;
      --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--ink); padding: 32px 16px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 16px; margin: 0 0 16px; font-weight: 600; }
    .status { color: var(--muted); font-size: 13px; }
    .controls { display: flex; align-items: center; gap: 12px; }
    label { font-size: 14px; color: var(--muted); }
    select {
      font-size: 14px; padding: 8px 12px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--ink);
    }
    .meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .meta b { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Cost Radar</h1>
    <p class="subtitle">구매처에 따른 상품 가격 추이 대시보드</p>
 
    <!-- 상품 선택 드롭다운 -->
    <div class="card">
      <div class="controls">
        <label for="product-select">상품 선택</label>
        <select id="product-select"><option>불러오는 중…</option></select>
      </div>
      <div class="meta" id="product-meta"></div>
    </div>
 
    <!-- 차트 -->
    <div class="card">
      <h2>가격 추이 (구매처 비교)</h2>
      <canvas id="priceChart" height="140"></canvas>
    </div>
  </div>
 
  <script>
    let ALL = null;      // 서버에서 받은 전체 데이터를 담아둠
    let chart = null;    // 차트 객체 (상품 바꿀 때 다시 그리려고 보관)
 
    // ── 1) 서버에서 데이터 가져오기 ──────────────────────────
    //    2단계에서 실제 API 주소가 생기면 이 URL만 바꾸면 된다.
    async function loadData() {
      const res = await fetch("/api/prices");
      if (!res.ok) throw new Error("데이터를 불러오지 못했어요 (" + res.status + ")");
      return res.json();
    }
 
    // ── 2) 드롭다운을 상품 목록으로 채우기 ───────────────────
    function fillProductSelect(products) {
      const sel = document.getElementById("product-select");
      sel.innerHTML = "";
      products.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.product_id;
        opt.textContent = p.source_product_name;
        sel.appendChild(opt);
      });
      sel.onchange = () => render(Number(sel.value));
    }
 
    // ── 3) 선택된 상품의 데이터를 Chart.js 모양으로 변환 ──────
    function buildChartData(productId) {
      const obsForProduct = ALL.observations.filter(o => o.product_id === productId);
      const labels = [...new Set(obsForProduct.map(o => o.survey_date))].sort();
      const colors = ["#2563eb", "#16a34a", "#db2777", "#d97706"];
 
      const datasets = ALL.stores.map((store, i) => {
        const points = labels.map(d => {
          const obs = obsForProduct.find(o => o.store_id === store.store_id && o.survey_date === d);
          return obs ? obs.unit_price : null;
        });
        return {
          label: store.name, data: points,
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length],
          tension: 0.3, pointRadius: 4,
        };
      });
      return { labels, datasets };
    }
 
    // ── 4) 상품 정보(제조사/용량) 표시 ───────────────────────
    function showMeta(productId) {
      const p = ALL.products.find(x => x.product_id === productId);
      document.getElementById("product-meta").innerHTML =
        "제조사 <b>" + p.manufacturer + "</b> · 용량 <b>" + p.quantity + p.unit + "</b>";
    }
 
    // ── 5) 차트 그리기 (상품 바뀔 때마다 호출) ────────────────
    function render(productId) {
      showMeta(productId);
      const data = buildChartData(productId);
      if (chart) chart.destroy();   // 기존 차트를 지우고 새로 그린다
      chart = new Chart(document.getElementById("priceChart"), {
        type: "line",
        data: data,
        options: {
          responsive: true,
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: ctx => ctx.dataset.label + ": " + ctx.parsed.y.toLocaleString() + "원",
              },
            },
          },
          scales: {
            y: {
              title: { display: true, text: "가격 (원)" },
              ticks: { callback: v => v.toLocaleString() + "원" },
            },
          },
        },
      });
    }
 
    // ── 6) 전체 실행 ─────────────────────────────────────────
    async function main() {
      try {
        ALL = await loadData();
        fillProductSelect(ALL.products);
        render(ALL.products[0].product_id);  // 첫 상품을 기본으로 그림
      } catch (err) {
        document.getElementById("product-meta").innerHTML =
          '<span class="status">' + err.message + '</span>';
      }
    }
    main();
  </script>
</body>
</html>
